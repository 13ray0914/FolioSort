name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.10 security and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements_v4.txt
            requirements_network_v4.txt

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[network,dev]"

      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m venv /tmp/foliosort-wheel-test
          /tmp/foliosort-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/foliosort-wheel-test/bin/foliosort --version
          /tmp/foliosort-wheel-test/bin/foliosort init /tmp/foliosort-workspace
          test -f /tmp/foliosort-workspace/scripts/review_app_server.py
          test -f /tmp/foliosort-workspace/config.json

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q foliosort lib scripts run_pipeline.py check_environment.py

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.grobid.yml config --quiet

      - name: Smoke-load changed entry points
        run: |
          python scripts/review_app_server.py --help
          python scripts/curation_server.py --help
          python scripts/13_build_multiplex_network.py --help
          python scripts/14_build_knowledge_graph.py --help
          python scripts/15_recluster_network.py --help

  # Runs ONLY when a vX.Y.Z tag is pushed AND that tag is on main.
  # Tagging a commit on a feature branch (before merging) will fail the
  # "Verify tag is on main" step and produce no release.
  release:
    name: Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need full history to check ancestry

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tag $GITHUB_REF_NAME points to a commit that is not"
            echo "       on the main branch. Merge the PR first, then retag."
            exit 1
          fi
          echo "Ancestry check passed: $GITHUB_SHA is on origin/main"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Verify __version__ matches tag
        run: |
          PKG_VERSION="$(python -c 'from foliosort import __version__; print(__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: foliosort/__init__.py __version__ = '$PKG_VERSION'"
            echo "       tag is '$GITHUB_REF_NAME' (expects '$TAG_VERSION')"
            echo "Bump __version__ in foliosort/__init__.py and retag."
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION == $TAG_VERSION"

      - name: Build wheel and sdist
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: "FolioSort ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
